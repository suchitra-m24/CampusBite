<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — CampusBite</title>
<link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
</head>
<body>

<div id="cb-topbar" class="cb-topbar"></div>

<main class="container-cb" style="padding-top:28px; padding-bottom:80px;">

  <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:22px;">
    <div>
      <div class="eyebrow">Today's menu</div>
      <h1 class="display" style="font-size:2rem; margin-top:4px;">What are you craving?</h1>
    </div>
    <div id="crowdMeterHost" style="min-width:280px;"></div>
  </div>

  <div id="canteenStatusHost"></div>

  <div id="specialsHost"></div>

  <div style="display:flex; gap:12px; margin:18px 0 14px; flex-wrap:wrap; align-items:center;">
    <input class="form-control" id="menuSearch" placeholder="Search the menu…" style="max-width:280px;" oninput="renderMenuGrid()">
    <div style="display:flex; gap:8px;">
      <button class="pill active" id="dietFilterAll" onclick="cbFilterDiet('all', this)">All</button>
      <button class="pill" id="dietFilterVeg" onclick="cbFilterDiet('VEG', this)">🟢 Veg</button>
      <button class="pill" id="dietFilterNonVeg" onclick="cbFilterDiet('NON_VEG', this)">🟤 Non-veg</button>
    </div>
  </div>

  <div style="display:flex; gap:10px; margin:0 0 22px; flex-wrap:wrap;" id="categoryPills"></div>

  <div id="menuGrid" class="row g-4"></div>
  <div id="menuEmpty" class="empty-state" style="display:none;">
    <h3>Nothing here yet</h3>
    <p>Check back soon — the kitchen is updating the menu.</p>
  </div>
</main>

<!-- Customization picker -->
<div id="customizeModalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:170; align-items:center; justify-content:center;">
  <div class="cb-card cb-card-pad" style="width:400px; max-width:90vw;">
    <h3 id="customizeModalTitle" style="margin-bottom:14px;">Customize</h3>
    <div id="customizeOptionsHost" style="margin-bottom:18px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn-cb btn-magenta" style="flex:1;" onclick="cbConfirmCustomizedAdd()">Add to cart</button>
      <button class="btn-cb btn-ghost" onclick="cbCloseCustomizeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Cart -->
<button class="cart-fab" id="cartFab" onclick="cbOpenCart()" style="display:none;">
  🧺 <span id="cartCount">0</span> · <span id="cartTotal">₹0.00</span>
</button>
<div class="cart-drawer-backdrop" id="cartBackdrop" onclick="cbCloseCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div style="padding:22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
    <h3>Your cart</h3>
    <button class="btn-ghost btn-cb btn-sm" onclick="cbCloseCart()">Close</button>
  </div>
  <div id="cartItemsHost" style="flex:1; overflow-y:auto; padding:16px 22px;"></div>
  <div style="padding:20px 22px; border-top:1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-weight:600;">
      <span>Total</span><span id="cartDrawerTotal">₹0.00</span>
    </div>
    <input class="form-control" id="specialInstructions" placeholder="Special instructions (optional)" style="margin-bottom:12px;">
    <button class="btn-cb btn-cyan btn-block" id="placeOrderBtn" onclick="cbPlaceOrder()">Place order — auto-assign my slot</button>
    <p style="font-size:0.78rem; color:var(--text-soft); margin-top:10px;">
      We'll assign the earliest pickup slot the kitchen can actually hit, based on current load.
    </p>
  </div>
</div>

<script src="../vendor/axios/axios.min.js"></script>
<script src="../vendor/sockjs/sockjs.min.js"></script>
<script src="../vendor/stompjs/stomp.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/push.js"></script>
<script src="../js/student.js"></script>
<script>
  CBAuth.requireRole(["STUDENT", "TEACHER"]);
  cbRenderTopbar("/student/dashboard.html");
  cbInitBroadcastBanner();
  cbInitCanteenStatus();
  cbInitDashboard();
</script>
</body>
</html>
