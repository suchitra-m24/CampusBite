<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CampusBite</title>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div class="cb-card cb-card-pad" style="max-width:420px; width:100%;">
    <div class="cb-brand" style="justify-content:center; margin-bottom:20px;">
      <span class="cb-brand-mark">CB</span> CampusBite
    </div>
    <h3 style="margin-bottom:6px; text-align:center;">Set a new password</h3>
    <p style="color:var(--text-soft); font-size:0.85rem; margin-bottom:20px; text-align:center;">This link is valid for 30 minutes from when it was generated.</p>

    <form id="resetForm" class="form-cb">
      <div style="margin-bottom:16px;">
        <label>New password</label>
        <input type="password" class="form-control" id="newPassword" placeholder="At least 8 characters" minlength="8" required>
      </div>
      <button type="submit" class="btn-cb btn-cyan btn-block" id="resetBtn">Reset password</button>
    </form>
    <div id="resultHost" style="margin-top:16px;"></div>
  </div>
</div>

<script src="vendor/axios/axios.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get("token");

  if (!token) {
    document.getElementById("resetForm").style.display = "none";
    document.getElementById("resultHost").innerHTML = `<div class="cb-card cb-card-pad" style="color:var(--danger);">No reset token found in the URL.</div>`;
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("resetBtn");
    btn.disabled = true; btn.textContent = "Resetting…";
    try {
      await cbApi.post("/api/auth/reset-password", {
        token,
        newPassword: document.getElementById("newPassword").value,
      });
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("resultHost").innerHTML = `
        <div class="cb-card cb-card-pad" style="text-align:center;">
          <h4 style="color:var(--success); margin-bottom:10px;">Password reset!</h4>
          <p style="color:var(--text-soft); font-size:0.85rem; margin-bottom:14px;">All your other sessions have been signed out for safety.</p>
          <a href="/index.html" class="btn-cb btn-cyan">Log in</a>
        </div>`;
    } catch (err) {
      cbToast(cbErrorMessage(err), "error");
      btn.disabled = false; btn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
